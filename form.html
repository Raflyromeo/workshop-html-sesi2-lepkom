<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js"></script>
  </head>
  <body>
    <h1>Registration Form</h1>
    <form action="">
      <table>
        <tr>
          <td>Nama Lengkap</td>
          <td>:</td>
          <td><input id="nama" type="text" placeholder="Your name.." /></td>
        </tr>
        <tr>
          <td>Tempat Lahir</td>
          <td>:</td>
          <td><input id="tempat" type="text" /></td>
        </tr>
        <tr>
          <td>Tanggal Lahir</td>
          <td>:</td>
          <td><input id="tanggal" type="date" /></td>
        </tr>
        <tr>
          <td>Jenis Kelamin</td>
          <td>:</td>
          <td><input id="jkp" name="sex" type="radio" value="pria" />Pria</td>
          <br />
          <td>
            <input id="jkl" name="sex" type="radio" value="wanita" />Wanita
          </td>
        </tr>
        <tr>
          <td>Alamat</td>
          <td>:</td>
          <td><textarea name="" id="alamat" cols="40" rows="3"></textarea></td>
        </tr>
        <tr>
          <td>Email</td>
          <td>:</td>
          <td><input id="email" type="text" /></td>
        </tr>
        <tr>
          <td>No. HP</td>
          <td>:</td>
          <td><input id="hp" type="text" /></td>
        </tr>
        <tr>
          <td>Kota</td>
          <td>:</td>
          <td>
            <select name="" id="">
              <option value="">***** Select Kota *****</option>
              <option value="">Bogor</option>
              <option value="">Jakarta</option>
              <option value="">Bekasi</option>
              <option value="">Tangerang</option>
              <option value="">Depok</option>
              <option value="">Cikarang</option>
              <option value="">Banten</option>
            </select>
          </td>
        </tr>
        <tr>
          <td>&nbsp;</td>
          <td>&nbsp;</td>
          <td>
            <input
              onclick="simpan()"
              type="submit"
              name="submit"
              value="simpan"
            /><input type="reset" name="reset" value="batal" />
          </td>
        </tr>
      </table>
    </form>
  </body>
</html>
